services:
  db:
    image: postgres:16-alpine
    container_name: django_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports qismini olib tashladik (faqat ichki tarmoqda ishlaydi - XAVFSIZLIK)

  # AVTOMATIK BACKUP SERVISI
  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: django_db_backup
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily" # Har kuni bir marta backup qiladi
      BACKUP_KEEP_DAYS: 7 # 7 kunlik backupni saqlaydi
    volumes:
      - ./backups:/backups
    depends_on:
      - db

  redis:
    image: redis:7.2-alpine
    container_name: django_redis
    restart: always
    # Portni tashqariga ochish shart emas, admin ichkaridan bog'lanadi

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-58-48Z
    container_name: django_minio
    restart: always
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  admin:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: django_app
    restart: always
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - minio
  api:
    build:
      context: ./api # Go loyihangiz joylashgan papka
      dockerfile: Dockerfile
    container_name: golang_fiber
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis:6379
      MINIO_ENDPOINT: minio:9000
    ports:
      - "3000:3000" # Fiber odatda 3000-portda ishlaydi
    depends_on:
      - db
      - redis
      - minio

volumes:
  postgres_data:
  minio_data:
